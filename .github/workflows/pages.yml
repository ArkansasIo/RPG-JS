name: Deploy RPGJS documentation and browser demo to GitHub Pages

on:
  push:
    branches:
      - v5
    paths:
      - "docs/**"
      - "playground/games/dash/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install repository workspace dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Install documentation dependencies
        working-directory: docs
        run: npm ci

      - name: Build VitePress documentation
        working-directory: docs
        run: npx vitepress build

      - name: Build RPGJS workspace packages
        run: pnpm build

      - name: Build original RPGJS browser example
        working-directory: playground/games/dash
        env:
          GITHUB_PAGES: "true"
        run: pnpm build

      - name: Publish RPGJS browser example under documentation site
        run: |
          mkdir -p docs/.vitepress/dist/browser-rpg
          cp -R playground/games/dash/dist/. docs/.vitepress/dist/browser-rpg/

      - name: Verify built site entry points
        run: |
          test -s docs/.vitepress/dist/index.html
          test -s docs/.vitepress/dist/browser-rpg/index.html
          grep -q '/RPG-JS/browser-rpg/' docs/.vitepress/dist/browser-rpg/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
